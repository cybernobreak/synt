<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Protocolo Não Localizado | SYNTHEXIS</title>
    <link rel="icon" type="image/jpeg" href="./images/logo.jpeg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        synth: {
                            bg: '#ffffff',
                            card: '#f8fafc',
                            text: '#0f172a',
                            muted: '#64748b',
                            blue: '#1d4ed8',
                            lightbl: '#eff6ff',
                            border: '#e2e8f0',
                            accent: '#3b82f6'
                        }
                    },
                    fontFamily: {
                        sora: ['Sora', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #ffffff;
            color: #0f172a;
            overflow-x: hidden;
        }
        
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .text-blue-gradient {
            background: linear-gradient(to right, #1d4ed8, #3b82f6, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body class="font-inter antialiased selection:bg-synth-blue selection:text-white relative bg-synth-bg flex flex-col min-h-screen">

    <div class="noise-overlay"></div>

    <!-- Header Minimalista -->
    <header class="w-full h-20 border-b border-synth-border px-6 md:px-12 flex items-center justify-center fixed top-0 left-0 glass-panel z-40">
        <div class="flex items-center gap-3">
            <img src="./images/logo.jpeg" alt="Synthexis Logo" class="h-10 w-auto object-contain mix-blend-multiply" style="filter: contrast(1.1) brightness(1.05);">
            <span class="font-sora tracking-widest text-xs uppercase font-semibold text-synth-text">SYNTHEXIS</span>
        </div>
    </header>

    <!-- Main Content 404 -->
    <main class="flex-grow flex items-center justify-center px-6 pt-20 relative z-10">
        <div class="text-center max-w-lg mx-auto">
            
            <div class="w-24 h-24 bg-synth-lightbl border border-synth-blue/20 rounded-2xl flex items-center justify-center mx-auto mb-8 text-synth-blue shadow-sm">
                <i data-lucide="microscope" class="w-12 h-12"></i>
            </div>
            
            <h1 class="text-7xl md:text-9xl font-sora font-light text-synth-text mb-4 tracking-tight">
                <span class="text-blue-gradient font-medium">404</span>
            </h1>
            
            <h2 class="text-2xl font-sora text-synth-text mb-4 font-medium">Protocolo Não Localizado</h2>
            
            <p class="text-synth-muted font-light leading-relaxed mb-10 text-sm">
                A página ou documento que você tentou acessar não existe em nossa base de dados ou o link foi alterado.
            </p>
            
            <a href="/index.html" class="inline-flex items-center justify-center gap-3 px-8 py-4 bg-synth-blue text-white rounded-full text-xs font-sora hover:bg-blue-800 transition-all shadow-md group">
                <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
                <span class="uppercase tracking-widest font-medium">Retornar à Base</span>
            </a>
            
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
